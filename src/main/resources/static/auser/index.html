<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>我的运动主场 | 大学生体育用品网</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/sports-console.css">
    <script src="../js/admin.js"></script>

    <script type="text/javascript">
        function logout() {
            sessionStorage.removeItem("user");
            window.parent.location = "../index.html";
        }
    </script>
</head>

<body class="console-shell">
    <div class="admin" id="userShell">
        <div class="top">
            <div class="logo">
                <a class="console-brand" href="right.html" target="rightiframe" aria-label="返回会员中心">
                    <span class="console-brand__mark">
                        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <circle cx="24" cy="24" r="17" stroke="#111827" stroke-width="2.6" />
                            <path d="M7.5 24h33M24 6.8c-6 4.9-9 10.7-9 17.2s3 12.3 9 17.2M24 6.8c6 4.9 9 10.7 9 17.2s-3 12.3-9 17.2"
                                stroke="#111827" stroke-width="2.2" stroke-linecap="round" />
                            <path d="M27.8 11.8 18.6 25h6.6L20.2 36.4 31.8 21.8h-6.7z" fill="#ff6b3d"
                                stroke="#111827" stroke-width="1.6" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <span class="console-brand__copy">
                        <strong>校园运动会员中心</strong>
                        <small>CAMPUS SPORTS CLUB</small>
                    </span>
                </a>

                <div class="console-top-meta">
                    <span class="console-top-chip"><i></i>我的运动主场</span>
                    <span class="console-top-date">TRAIN · PLAY · REPEAT</span>
                </div>
            </div>

            <div class="toolBtn" id="app">
                <div class="console-user">
                    <span class="console-user__avatar">{{ user.username ? user.username.charAt(0) : '会' }}</span>
                    <span class="console-user__copy">
                        <small>MEMBER</small>
                        <b>{{user.username}}</b>
                    </span>
                </div>

                <span class="clear" id="clearCache">
                    <em>清除缓存</em>
                </span>
                <span class="shutdown" onclick="logout()">
                    <em>退出登录</em>
                </span>
                <button class="console-nav-toggle" id="navToggle" type="button" aria-label="展开菜单"
                    aria-expanded="false">
                    <span></span>
                </button>
            </div>
        </div>

        <div class="body">
            <div class="left">
                <div class="console-side-head">
                    <span>我的运动中心</span>
                    <small>MY CLUB</small>
                </div>

                <ul class="navTools">
                    <li>
                        <div class="menuLiT indexLink"><span class="t1 toolLink"><a href="/admin/userInfo/userinfo.html"
                                    target="rightiframe">我的信息</a></span></div>
                    </li>

                    <li>
                        <div class="menuLi"><span class="t3 toolLink">收货地址管理</span></div>
                        <dl class="downmenu">
                            <dd><a href="/admin/address/addressMine.html" target="rightiframe">地址列表</a></dd>
                            <dd><a href="/admin/address/addressAdd.html" target="rightiframe">添加收货地址</a></dd>
                        </dl>
                    </li>

                    <li>
                        <div class="menuLiT indexLink"><span class="t1 toolLink"><a href="/admin/order/orderMine.html"
                                    target="rightiframe">我的订单</a></span></div>
                    </li>

                    <li>
                        <div class="menuLiT indexLink"><span class="t1 toolLink"><a href="/admin/jifen/jifenMine.html"
                                    target="rightiframe">我的积分</a></span></div>
                    </li>

                    <li>
                        <div class="menuLiT indexLink"><span class="t1 toolLink"><a href="/admin/duihuan/duihuanMine.html"
                                    target="rightiframe">我的礼品兑换</a></span></div>
                    </li>
                </ul>

                <div class="console-side-note">
                    <span class="console-side-note__ball"></span>
                    <strong>今日也要动起来</strong>
                    <p>查看订单进度、兑换运动好礼，让每一次训练都有新装备相伴。</p>
                </div>
            </div>

            <div class="right">
                <iframe src="right.html" frameborder="0" id="rightiframe" name="rightiframe"></iframe>
            </div>
        </div>

        <div class="console-nav-backdrop" id="navBackdrop"></div>
    </div>

    <script src="/js/vue.min.js"></script>
    <script>
        document.addEventListener('click', function (event) {
            if (!event.target.closest('#clearCache')) {
                return;
            }
            tipAlert({
                title: "缓存清除成功",
                state: "true", //true成功 fail失败
                time: 1 //3秒后关闭
            });
        });

        $(function () {
            $('.indexLink .toolLink').click(function () {
                $('.navTools> li> .menuLi').removeClass('menuActive');
                $('.downmenu>dd').removeClass('onLink');
            })
            $('.navTools> li> .menuLi').click(function () {
                if (!$(this).hasClass('menuActive')) {
                    $('.navTools> li> .menuLi').removeClass('menuActive');
                    $(this).addClass('menuActive');
                } else {
                    $(this).removeClass('menuActive');
                }
            })

            $('.downmenu>dd>a').click(function (event) {
                event.stopPropagation();
                $('.downmenu>dd').removeClass('onLink');
                $(this).parent('dd').addClass('onLink');
            });

        })

        ;(function () {
            var shell = document.getElementById('userShell');

            function closeNav() {
                shell.classList.remove('nav-open');
                var toggle = document.getElementById('navToggle');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', 'false');
                }
            }

            document.addEventListener('click', function (event) {
                var toggle = event.target.closest('#navToggle');
                if (toggle) {
                    var opened = shell.classList.toggle('nav-open');
                    toggle.setAttribute('aria-expanded', opened ? 'true' : 'false');
                    return;
                }
                if (event.target.closest('#navBackdrop')) {
                    closeNav();
                }
            });

            $('.navTools a').on('click', closeNav);
        })();

        new Vue({
            el: '#app',
            data:
            {
                user: {

                },
            },

            methods:
            {


            },

            created() {
                var userJsonString = sessionStorage.getItem("user");
                if (userJsonString != null)//判断是否登录
                {
                    var user = JSON.parse(userJsonString);
                    this.user = user;
                }
                else {

                }
            },

        })

    </script>
</body>

</html>
