<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>无标题文档</title>



<script src="/js/vue.min.js"></script>

<script src="/elementui/index.js"></script>
<link href="/elementui/index.css" rel="stylesheet" type="text/css">

<script type="text/javascript" src="/js/axios.min.js"></script>
<link href="/css/layui.css" rel="stylesheet" type="text/css">  
<link href="/css/base.css" rel="stylesheet" type="text/css">  
<link href="/css/sports-console.css" rel="stylesheet" type="text/css">
</head>

<body style="margin: 13px;">
  <div id="loginDiv">
	<table class="layui-table">
    <thead>
      <tr>
		<th>序号</th>
		<th>姓名</th>
		<th>地址</th>
		<th>联系电话</th>

		<th>操作</th>
      </tr> 
    </thead>
    <tbody>
      <tr v-for="(address, index) in xianshilist" :key="address.id">
		<td>{{index+1}}</td>
		<td>{{address.xingming}}</td>
		<td>{{address.dizhi}}</td>
		<td>{{address.dianhua}}</td>

		<td>
			<input type="button" value="编辑" class="lvse" @click="edit(address)" style="width: 66px;"/>
			<input type="button" value="删除" class="hongse" @click="del(address.id)" style="width: 66px;"/>
	    </td>
      </tr>
    </tbody>
    </table>

	<el-pagination background 
		 layout="total, prev, pager, next" 
		 :total="total" 
		 :page-size="pageSize"
		 :current-page="currentPage" 
		 @current-change="handleCurrentChange">
	</el-pagination>

	<input type="button" value="添加地址" class="lanse" onclick="addressAdd()" style="width: 99px;"/>
	

    <el-dialog title="编辑" :visible.sync="dialogaddressEdit" width="60%">
	<table width="100%"  border="0" cellpadding="8" cellspacing="1" bgcolor="#CBD8AC">
		<tr bgcolor="#FFFFFF" style="height: 43px;">
			<td width="65" bgcolor="#FFFFFF" align="right">
				姓名：
			</td>
			<td bgcolor="#FFFFFF" align="left">
				&nbsp;<input type="text" v-model="address.xingming" style="width: 288px;"/>
			</td>
		</tr>
		<tr bgcolor="#FFFFFF" style="height: 43px;">
			<td width="65" bgcolor="#FFFFFF" align="right">
				住址：
			</td>
			<td bgcolor="#FFFFFF" align="left">
				&nbsp;<input type="text" v-model="address.dizhi" style="width: 388px;"/>
			</td>
		</tr>
		<tr bgcolor="#FFFFFF" style="height: 43px;">
			<td width="65" bgcolor="#FFFFFF" align="right">
				电话：
			</td>
			<td bgcolor="#FFFFFF" align="left">
				&nbsp;<input type="text" v-model="address.dianhua" style="width: 288px;"/>
			</td>
		</tr>
		<tr bgcolor="#FFFFFF" height="30">
			<td width="65" bgcolor="#FFFFFF" align="right">
				&nbsp;
			</td>
			<td bgcolor="#FFFFFF" align="left">
			&nbsp;<input type="button" value="提交" @click="addressUpdate()" style="width: 70px;"/>&nbsp; 
			</td>
		</tr>
		</table>   
	</el-dialog>
	


  </div>
  


<script type="text/javascript">
    function addressAdd()
	{
		var url="../address/addressAdd.html";
		window.location.href=url;
	}

	var vm = new Vue({
		
		el: '#loginDiv',
		data: 
		{
			total:0,
			pageSize:22,
			currentPage:1,//当前页

			addressList:[],
			xianshilist: null,	

			dialogaddressEdit:false,
			address:{
				
			},

			
		},
		methods: 
		{
			getData()
			{
               axios({
						method: 'POST',
						url: '/addressMine',
						params:{
							
						}
						}).then(data => {
							if (data.data.state == 66)
							{
								this.addressList=data.data.data;
								this.total=this.addressList.length;
								
	                            this.xianshilist = this.addressList.slice((this.currentPage - 1) * this.pageSize, this.currentPage * this.pageSize)
							} 
						    
						}).catch(error => {
							alert(error);
			    })
			},
			
			handleCurrentChange(currentPage)//用户点的页码
			{
				var _this = this;
				if (_this.addressList) 
				{
				   if (currentPage)
				   {
                      _this.currentPage = currentPage;
                   }
                   _this.xianshilist = _this.addressList.slice((_this.currentPage - 1) * _this.pageSize,_this.currentPage * _this.pageSize);
                } else {}

			},

			
			
			edit(address)
			{
				this.address={...address};
				this.dialogaddressEdit=true;
			},

			addressUpdate()
			{
				axios({
						method: 'POST',
						url: '/addressUpdate',
						data: this.address,
						/* params:{
							dianhua:this.address.dianhua,
							password:this.address.addressPw,
						} */
						}).then(data => {
							if (data.data.state == 66)
							{
								alert("修改成功");
								this.dialogaddressEdit=false;
								this.getData();
							}  
						    
						}).catch(error => {
							alert(error);
						})
			},
			
			del(id)
			{
				if(confirm('您确定删除吗？'))
				{
					axios({
						method: 'POST',
						url: '/addressDel',
						//data: this.address,
						params:{
							id:id,
						} 
						}).then(data => {
							if (data.data.state == 66)
							{
								alert("删除成功");
								this.currentPage=1;
								this.getData();
							}  
							
						}).catch(error => {
							alert(error);
					})
				}
			},

			addressRes()
			{
				axios({
						method: 'POST',
						url: '/addressRes',

						params:{
							xingming:this.xingming,
							dianhua:this.dianhua,
						}
						}).then(data => {
							if (data.data.state == 66)
							{
								this.addressList=data.data.data;
								this.total=this.addressList.length;
								
	                            this.xianshilist = this.addressList.slice((this.currentPage - 1) * this.pageSize, this.currentPage * this.pageSize)
							} 
						    
						}).catch(error => {
							alert(error); 
					    
				})
				this.currentPage=1;
			},


		},
		created()
		{
			this.getData();
		}

	
	    
	})
</script>


<style>
    .el-pagination{
		text-align: right;
		padding-top: 20px;
	}
</style>

</body>
</html>
