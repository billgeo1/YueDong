<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>无标题文档</title>



<script src="/js/vue.min.js"></script>

<script src="/elementui/index.js"></script>
<link href="/elementui/index.css" rel="stylesheet" type="text/css">

<script type="text/javascript" src="/js/axios.min.js"></script>
<link href="/css/layui.css" rel="stylesheet" type="text/css">  
<link href="/css/base.css" rel="stylesheet" type="text/css">  
<link href="/css/sports-console.css" rel="stylesheet" type="text/css">
</head>

<body style="margin: 13px;">
  <div id="loginDiv">
	<table class="layui-table">
    <thead>
      <tr>
		<th>序号</th>
		<th>用户</th>
		<th>商品</th> 
		<th>评价属性</th>
		
		<th>内容</th>
		<th>时间</th>
		<th>操作</th>
      </tr> 
    </thead>
    <tbody>
      <tr v-for="(pingjia, index) in xianshilist" :key="pingjia.id">
		<td>{{index+1}}</td>
		<td>{{pingjia.user.username}}</td>
		<td>{{pingjia.product.title}}</td> 
		<td>{{pingjia.shuxing}}</td>
		
		<td>{{pingjia.neirong}}</td>
		<td>{{pingjia.shijian}}</td>
		<td>
			<input type="button" value="删除" class="hongse" @click="del(pingjia.id)" style="width: 66px;"/>
	    </td>
      </tr>
    </tbody>
    </table>

	<el-pagination background 
		 layout="total, prev, pager, next" 
		 :total="total" 
		 :page-size="pageSize"
		 :current-page="currentPage" 
		 @current-change="handleCurrentChange">
	</el-pagination>



  </div>
  


<script type="text/javascript">
	var vm = new Vue({
		
		el: '#loginDiv',
		data: 
		{
			total:0,
			pageSize:2,
			currentPage:1,//当前页

			pingjiaList:[],
			xianshilist: null,	

			dialogpingjiaEdit:false,
			pingjia:{
				
			},

		},
		methods: 
		{
			getData()
			{
               axios({
						method: 'POST',
						url: '/pingjiaMana',
						params:{
							
						}
						}).then(data => {
							if (data.data.state == 66)
							{
								this.pingjiaList=data.data.data;
								this.total=this.pingjiaList.length;
								
	                            this.xianshilist = this.pingjiaList.slice((this.currentPage - 1) * this.pageSize, this.currentPage * this.pageSize)
							} 
						    
						}).catch(error => {
							alert(error);
			    })
			},
			
			handleCurrentChange(currentPage)//用户点的页码
			{
				var _this = this;
				if (_this.pingjiaList) 
				{
				   if (currentPage)
				   {
                      _this.currentPage = currentPage;
                   }
                   _this.xianshilist = _this.pingjiaList.slice((_this.currentPage - 1) * _this.pageSize,_this.currentPage * _this.pageSize);
                } else {}

			},

			
			
			
			del(id)
			{
				if(confirm('您确定删除吗？'))
				{
					axios({
						method: 'POST',
						url: '/pingjiaDel',
						//data: this.pingjia,
						params:{
							id:id,
						} 
						}).then(data => {
							if (data.data.state == 66)
							{
								alert("删除成功");
								this.currentPage=1;
								this.getData();
							}  
							
						}).catch(error => {
							alert(error);
					})
				}
			},


		},
		created()
		{
			this.getData();
		}

	
	    
	})
</script>


<style>
    .el-pagination{
		text-align: right;
		padding-top: 20px;
	}
</style>

</body>
</html>
