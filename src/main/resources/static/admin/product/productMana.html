<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>无标题文档</title>



<script src="/js/vue.min.js"></script>

<script src="/elementui/index.js"></script>
<link href="/elementui/index.css" rel="stylesheet" type="text/css">

<script type="text/javascript" src="/js/axios.min.js"></script>
<link href="/css/layui.css" rel="stylesheet" type="text/css">  
<link href="/css/base.css" rel="stylesheet" type="text/css">  
<link href="/css/sports-console.css" rel="stylesheet" type="text/css">

<script src="/ckeditor/ckeditor.js"></script>
</head>

<body style="margin: 13px;">
  <div id="loginDiv">
	<template>
		<span style="margin-left: 8px;">商品标题：</span>
		<input type="text" v-model.trim="title" size="17"/>
		<input type="button" value="查询" @click="productRes()" class="lanse" style="width: 86px;"/>
	</template>
	<table class="layui-table">
    <thead>
      <tr>
		<th>序号</th>
		<th>类别</th>
		<th>商品标题</th>
        <!-- <th>商品介绍</th> -->
        
		<th>图片</th>
		<th>价格</th>
		<th>库存</th>
		<th>操作</th>
      </tr> 
    </thead>
    <tbody>
      <tr v-for="(product, index) in xianshilist" :key="product.id">
        <td>{{index+1}}</td>
		<td>{{product.leibie.mingcheng}}</td>
		<td>{{product.title}}</td>
		<!-- <td>{{product.jieshao}}</td> -->
		
		<td style="width: 13%;">
			<img :src= "product.image" />
		</td>
		<td>{{product.price}}</td>
		<td>{{product.kucun}}</td>
		<td>
			<input type="button" value="编辑" class="lvse" @click="edit(product.id)" style="width: 66px;"/>
			<input type="button" value="删除" class="hongse" @click="del(product.id)" style="width: 66px;"/>
	    </td>
      </tr>
    </tbody>
    </table>

	<el-pagination background 
		 layout="total, prev, pager, next" 
		 :total="total" 
		 :page-size="pageSize"
		 :current-page="currentPage" 
		 @current-change="handleCurrentChange">
	</el-pagination>
	
	<input type="button" value="添加商品" class="lanse" onclick="productAdd()" style="width: 99px;"/>

  </div>
  


<script type="text/javascript">
    function productAdd()
	{
		var url="../product/productAdd.html";
		window.location.href=url;
	}

	var vm = new Vue({
		
		el: '#loginDiv',
		data: 
		{
			total:0,
			pageSize:2,
			currentPage:1,//当前页

			productList:[],
			xianshilist: null,	

			product:{
				
			},
			title:"",
		},
		methods: 
		{
			getData()
			{
               axios({
						method: 'POST',
						url: '/productMana',
						params:{
							
						}
						}).then(data => {
							if (data.data.state == 66)
							{
								this.productList=data.data.data;
								this.total=this.productList.length;
								
	                            this.xianshilist = this.productList.slice((this.currentPage - 1) * this.pageSize, this.currentPage * this.pageSize)
							} 
						    
						}).catch(error => {
							alert(error);
			    })
			},
			
			handleCurrentChange(currentPage)//用户点的页码
			{
				var _this = this;
				if (_this.productList) 
				{
				   if (currentPage)
				   {
                      _this.currentPage = currentPage;
                   }
                   _this.xianshilist = _this.productList.slice((_this.currentPage - 1) * _this.pageSize,_this.currentPage * _this.pageSize);
                } else {}

			},

			
			
			del(id)
			{
				if(confirm('您确定删除吗？'))
				{
					axios({
						method: 'POST',
						url: '/productDel',
						//data: this.fang,
						params:{
							id:id,
						} 
						}).then(data => {
							if (data.data.state == 66)
							{
								alert("删除成功");
								this.currentPage=1;
								this.getData();
							}  
							
						}).catch(error => {
							alert(error);
					})
				}
			},


			edit(id)
			{
				var url="productPre.html?id="+id;
				window.location.href=url;
			},

			down(url)
			{
				window.location.href="/down?url="+url;
			},

			handleFileChange(event) 
			{
				this.file = event.target.files[0];
			},

			upload()
			{
				/* if(this.$refs.fileRef.value=="") */
				if(this.file=="")
				{
					alert("请选择文件");
					return false;
				}

				let formFile = new FormData();
				formFile.append("file", this.file);
				
                axios({
						method: 'POST',
						url: '/upload',
						data: formFile, 
						/* params:{
							username:this.product.userName,
							password:this.product.userPw,
						} */
						}).then(data => {
							if (data.data.state == 66)
							{
								alert("上传成功");
								this.file='';
								var fujian=data.data.data; 
								this.product.fujian=fujian.fujian;
								this.product.fujianYuan=fujian.fujianYuan;
							} 
						}).catch(error => {
							alert(error);
				})


			},

			productRes()
			{
               axios({
						method: 'POST',
						url: '/productRes',
						params:{
							title:this.title,
						}
						}).then(data => {
							if (data.data.state == 66)
							{
								this.productList=data.data.data;
								this.total=this.productList.length;
								this.currentPage=1;
	                            this.xianshilist = this.productList.slice((this.currentPage - 1) * this.pageSize, this.currentPage * this.pageSize)
							} 
						    
						}).catch(error => {
							alert(error);
			    })
			},

		},
		created()
		{
			this.getData();
		},
		
	    
	})
</script>


<style>
    .el-pagination{
		text-align: right;
		padding-top: 20px;
	}
</style>

</body>
</html>
