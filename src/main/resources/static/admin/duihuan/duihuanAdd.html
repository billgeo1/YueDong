<script type="text/javascript">
	function getUrlParam(name) 
	{
		var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); //构造一个含有目标参数的正则表达式对象
		var r = window.location.search.substr(1).match(reg);  //匹配目标参数
		if (r != null) return unescape(r[2]); return null; //返回参数值
	}
	
	function timeStamp2String(time)
	{

	    var datetime = new Date();

	    datetime.setTime(time);

	    var year = datetime.getFullYear();

	    var month = datetime.getMonth() + 1 < 10 ? "0" + (datetime.getMonth() + 1) : datetime.getMonth() + 1;

	    var date = datetime.getDate() < 10 ? "0" + datetime.getDate() : datetime.getDate();

	    var hour = datetime.getHours()< 10 ? "0" + datetime.getHours() : datetime.getHours();

	    var minute = datetime.getMinutes()< 10 ? "0" + datetime.getMinutes() : datetime.getMinutes();


	    return year + "-" + month + "-" + date+" "+hour+":"+minute;
	}
	
	function getshijian()
	{
		 document.getElementById("shijian").value=timeStamp2String(new Date().getTime());
	}

	function duihuanAdd()
	{
		if(document.formAdd.lipin.value=="")
        {
            alert("请选择礼品");
            return false;
        } 
		
		var jifenMy = getUrlParam('jifenMy');
        if(document.formAdd.lipin.value=="聚宝盆")
        {
            var suoxujifen=5000
            if(suoxujifen > jifenMy)
           	{
            	alert("积分不够");
            	return false;
           	}
            
        }
        if(document.formAdd.lipin.value=="保温杯")
        {
            var suoxujifen=10000
            if(suoxujifen > jifenMy)
           	{
            	alert("积分不够");
            	return false;
           	}
            
        }
        
        if(document.formAdd.dizhi.value=="")
        {
            alert("请输入收货地址");
            return false;
        } 
        if(document.formAdd.dianhua.value=="")
        {
            alert("请输入联系电话");
            return false;
        } 
        
        document.formAdd.submit();
	}
</script>
	  
</head>
